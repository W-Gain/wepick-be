plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.6'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'info.solidsoft.pitest' version '1.19.0'
}

group = 'gguip1'
version = '0.0.1-SNAPSHOT'
description = 'KTB - Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'

    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    /**
     * OpenAPI 3 연동을 위한 springdoc-openapi 라이브러리
     */
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.14'
    implementation 'org.apache.commons:commons-lang3:3.18.0' // 취약점 해결된 최신 버전으로 업데이트

    /**
     * 유효성 검사(Validation) 라이브러리
     */
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

    /**
     * 비밀번호 암호화를 위한 Spring Security Crypto 모듈
     */
    implementation 'org.springframework.security:spring-security-crypto:6.4.5'

    implementation 'org.springframework.session:spring-session-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'


	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mysql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

def pitestTargetClasses = providers.gradleProperty('pitestTargetClasses')
		.map { value -> value.split(',').collect { name -> name.trim() }.findAll { name -> !name.isEmpty() } }
		.getOrElse([])
def pitestTargetTests = providers.gradleProperty('pitestTargetTests')
		.map { value -> value.split(',').collect { name -> name.trim() }.findAll { name -> !name.isEmpty() } }
		.getOrElse([])

pitest {
	junit5PluginVersion = '1.2.3'
	pitestVersion = '1.22.1'
	mutators = ['DEFAULTS']
	targetClasses = pitestTargetClasses
	targetTests = pitestTargetTests
	failWhenNoMutations = true
	outputFormats = ['XML', 'HTML']
	timestampedReports = false
}

tasks.register('validatePitestSelection') {
	dependsOn tasks.named('testClasses')
	doLast {
		if (pitestTargetClasses.isEmpty()) {
			throw new GradleException('Set -PpitestTargetClasses to one or more fully qualified class names.')
		}
		if (pitestTargetTests.isEmpty()) {
			throw new GradleException('Set -PpitestTargetTests to one or more fully qualified test class names.')
		}

		def validateNames = { List<String> names, FileCollection classDirs, String propertyName ->
			def invalidNames = names.findAll { name -> name.contains('*') || name.contains('?') }
			if (!invalidNames.isEmpty()) {
				throw new GradleException("Use exact fully qualified class names for -P${propertyName}; wildcards are not accepted: ${invalidNames}")
			}
			def missingNames = names.findAll { name ->
				def classFile = name.replace('.', File.separator) + '.class'
				!classDirs.files.any { classDir -> new File(classDir, classFile).isFile() }
			}
			if (!missingNames.isEmpty()) {
				throw new GradleException("No compiled class found for -P${propertyName}: ${missingNames}")
			}
		}

		validateNames(pitestTargetClasses, sourceSets.main.output.classesDirs, 'pitestTargetClasses')
		validateNames(pitestTargetTests, sourceSets.test.output.classesDirs, 'pitestTargetTests')
	}
}

tasks.register('pitestSelectedTest', Test) {
	description = 'Runs only the explicitly selected tests before PIT.'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform()
	filter {
		pitestTargetTests.each { name -> includeTestsMatching(name) }
		failOnNoMatchingTests = true
	}
	dependsOn tasks.named('validatePitestSelection')
}

tasks.named('pitest') {
	dependsOn tasks.named('validatePitestSelection')
	dependsOn tasks.named('pitestSelectedTest')
	mustRunAfter tasks.named('pitestSelectedTest')
}
