spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  application:
    name: wepick-be
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/wepick-be}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
      flush-mode: immediate
    timeout: 1800
  servlet:
    multipart:
      max-file-size: ${APP_IMAGE_MAX_FILE_SIZE:5MB}
      max-request-size: ${APP_IMAGE_MAX_REQUEST_SIZE:25MB}

server:
  servlet:
    session:
      cookie:
        name: JSESSIONID
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  security:
    allowed-origin: ${APP_SECURITY_ALLOWED_ORIGIN:http://127.0.0.1:5173}
  auth:
    anonymous-voter:
      secure: ${ANONYMOUS_VOTER_COOKIE_SECURE:true}
    kakao:
      enabled: ${KAKAO_LOGIN_ENABLED:false}
      client-id: ${KAKAO_REST_API_KEY:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
      redirect-uri: ${KAKAO_REDIRECT_URI:}
      cookie-secure: ${KAKAO_LOGIN_COOKIE_SECURE:true}
      allow-insecure-loopback-cookie: ${KAKAO_ALLOW_INSECURE_LOOPBACK_COOKIE:false}
  image:
    max-file-size-bytes: ${APP_IMAGE_MAX_FILE_SIZE_BYTES:5242880}
    storage:
      local-root: ${IMAGE_STORAGE_LOCAL_ROOT:/data/uploads}
      public-prefix: ${IMAGE_PUBLIC_PREFIX:/uploads}

cors:
  allow-credentials: true
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
  allowed-headers: "*"
  max-age: 3600

auth:
  excluded-paths:
    get:
      - /actuator/health
    post:
      - /users
      - /auth
    delete: []
